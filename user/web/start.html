<!DOCTYPE html>

<html><head><meta charset="utf-8"><title>Start</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0a0f1c; color: #e6ecf5; font: 17px sans-serif; }
  main { max-width: 640px; padding: 24px; }
  h1 { color: #4be3c1; font-size: 32px; margin: 0 0 12px; }
  p { line-height: 1.5; color: #b8c2d4; }
  kbd { background: #1e2638; border-radius: 4px; padding: 1px 6px; color: #e6ecf5; }
</style></head>
<body><main>
  <h1>The web, on SIEOS</h1>
  <p>Type an address or words to search in the bar above (<kbd>Ctrl</kbd>+<kbd>L</kbd> takes you there).
     <kbd>F5</kbd> reloads; the arrows go back and forward.</p>
  <p>WPE WebKit draws the pages on the processor (no graphics card yet); secure sites are checked
     against the certificates in <code>/etc/ssl/roots</code>.</p>
</main></body></html>
