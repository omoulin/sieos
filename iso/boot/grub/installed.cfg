# The boot menu of SIEOS installed on a disk (sieinstall writes root=).
# Press Esc during the countdown for the menu (text console, etc.).
set timeout=2
set timeout_style=hidden
set default=0

insmod efi_gop
insmod all_video
set gfxmode=1024x768,auto
set gfxpayload=keep

menuentry "SIEOS - Synthetic Intelligence Enhanced Operating System" {
    multiboot2 /boot/kernel.elf root=SIEOS_INSTALL_ROOT_PLACEHOLDER
    module2 /boot/bootarch.tar boot_archive
    boot
}

menuentry "SIEOS (text console)" {
    multiboot2 /boot/kernel.elf text root=SIEOS_INSTALL_ROOT_PLACEHOLDER
    module2 /boot/bootarch.tar boot_archive
    boot
}

menuentry "SIEOS (wait at the boot messages)" {
    multiboot2 /boot/kernel.elf pause root=SIEOS_INSTALL_ROOT_PLACEHOLDER
    module2 /boot/bootarch.tar boot_archive
    boot
}
