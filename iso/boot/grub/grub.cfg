# Boot straight into the graphical login; press Esc during the countdown
# for the menu (text console, etc.).
set timeout=2
set timeout_style=hidden
set default=0

if [ "${grub_platform}" = "efi" ]; then
    insmod efi_gop
    insmod all_video
    set gfxmode=1024x768,auto
    set gfxpayload=keep
else
    set gfxpayload=text
fi

menuentry "SIEOS - Synthetic Intelligence Enhanced Operating System" {
    multiboot2 /boot/kernel.elf
    module2 /boot/rootfs.img rootfs
    module2 /boot/bootarch.tar boot_archive
    boot
}

menuentry "SIEOS (text console)" {
    multiboot2 /boot/kernel.elf text
    module2 /boot/rootfs.img rootfs
    module2 /boot/bootarch.tar boot_archive
    boot
}

menuentry "SIEOS (wait at the boot messages)" {
    multiboot2 /boot/kernel.elf pause
    module2 /boot/rootfs.img rootfs
    module2 /boot/bootarch.tar boot_archive
    boot
}
